<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Golden Fork | Reserve</title>
  <link rel="stylesheet" href="register.css">
</head>
<body>

  <header>
    <h2 class="logo">The Golden Fork</h2>
    <nav>
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="register.html">Reserve</a>
      <a href="services.html">Services</a>
      <a href="portfolio.html">Gallery</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <h1>Reserve a table</h1>

  <form action="#" method="post">

    <div>
      <label for="place">Restaurant</label>
      <input type="text" id="place" value="The Golden Fork" readonly>
    </div>

    <div>
      <label class="req" for="fullname">Full name</label>
      <input type="text" id="fullname" placeholder="Salman" required minlength="3" maxlength="40">
      <small>3 to 40 letters</small>
    </div>

    <div>
      <label class="req" for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" required>
    </div>

    <div>
      <label class="req" for="date">Date</label>
      <input type="date" id="date" required min="2026-11-01" max="2026-12-31">
    </div>

    <div>
      <label class="req" for="time">Time</label>
      <input type="time" id="time" required min="12:00" max="24:00">
    </div>

    <div>
      <label class="req" for="guests">Guests</label>
      <input type="number" id="guests" required min="1" max="12" value="0">
    </div>

    <div>
      <label for="seating">Seating</label>
      <select id="seating">
        <option value="" disabled>Choose seating</option>
        <option value="indoor" selected>Indoor</option>
        <option value="outdoor">Outdoor</option>
        <option value="family">Family hall</option>
      </select>
    </div>

    <div class="choices">
      <p>Meal</p>
      <label><input type="radio" name="meal"> Lunch</label>
      <label><input type="radio" name="meal" checked> Dinner</label>
    </div>

    <div class="choices">
      <p>Extras</p>
      <label><input type="checkbox"> Birthday cake</label>
      <label><input type="checkbox"> Window seat</label>
    </div>

    <div>
      <label for="notes">Special requests</label>
      <textarea id="notes" rows="4" maxlength="200" placeholder="Allergies, occasion, etc."></textarea>
    </div>

    <button type="submit">Confirm booking</button>
    <button type="reset">Clear</button>

  </form>

</body>
</html>
